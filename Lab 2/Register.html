    <h2>Registration</h2>
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="matric">Matric Number:</label>
        <input type="number" id="matric" name="matric"><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>


        <label for="Year">Year of Study:</label>
        <input type="radio" name="year" value="Year 1"> Year 1
        <input type="radio" name="year" value="Year 2"> Year 2
        <input type="radio" name="year" value="Year 3"> Year 3
        <input type="radio" name="year" value="Year 4"> Year 4 <br><br>

        <label for="session">Pick Your Sessions</label><br>
        <input type="checkbox" name="sessions" value="Cooking Demo">Interactive Cooking Demo<br>
        <input type="checkbox" name="sessions" value="Cooking Tips">Cooking Tips and Tricks<br>
        <input type="checkbox" name="sessions" value="Hands-on">Hands-on Cooking Session<br>
        <input type="checkbox" name="sessions" value="Q&A">Q&A Session<br>
        <input type="checkbox" name="sessions" value="Closing">Closing Ceremony<br><br>

        <label for="Programme">Programme or Faculty:</label>
        <select name="programme" id="programme">
            <option value="Faculty of Science">FSKM</option>
            <option value="Faculty of Engineering">FPEPS</option>
            <option value="Faculty of Business">FSPA</option>
            <option value="Faculty of Arts">FTKK</option> 
            <option value="Faculty of Arts">FSMA</option> 
            <option value="Faculty of Arts">FPM</option> 
            <option value="Faculty of Arts">FSSM</option> 
        </select><br><br>
        <input type="submit" value="Register">
